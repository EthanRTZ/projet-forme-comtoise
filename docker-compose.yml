services:
  mongo:
    image: mongo:8.2
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  migration:
    build: ./migration
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: forme_comtoise
      REDIS_URL: redis://redis:6379
    volumes:
      - ./data:/data:ro
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started

  api:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/forme_comtoise
      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: "true"
      REPORT_DIR: /reports
    volumes:
      - reports:/reports
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      migration:
        condition: service_completed_successfully

  worker:
    build: ./worker
    environment:
      MONGO_URI: mongodb://mongo:27017/forme_comtoise
      REDIS_URL: redis://redis:6379
      REPORT_DIR: /reports
      CELERY_BROKER_URL: redis://redis:6379/1
    volumes:
      - ./data:/data:ro
      - reports:/reports
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      migration:
        condition: service_completed_successfully

volumes:
  mongo-data:
  reports:
